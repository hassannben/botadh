<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📺 IPTV Player</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .btn {
      position: absolute;
      bottom: 20px;
      padding: 10px 15px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

<div class="container">
  <video id="video" controls autoplay></video>
  <button class="btn" onclick="goFull()">🖥 Full Screen</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById('video');
const streamURL = "https://sr1.oz-tv.xyz/s1/b_1_HD/index.m3u8";

// تشغيل البث
if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(streamURL);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, function () {
    video.play();
  });
} else {
  video.src = streamURL;
  video.play();
}

// Full screen function
function goFull() {
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitRequestFullscreen) {
    video.webkitRequestFullscreen();
  } else if (video.msRequestFullscreen) {
    video.msRequestFullscreen();
  }
}

// محاولة دخول fullscreen بعد الضغط على الصفحة
document.addEventListener("click", () => {
  goFull();
}, { once: true });

</script>

</body>
</html>
