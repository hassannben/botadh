<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📺 IPTV Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
    }

    .btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 10;
      padding: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="container">
  <video id="video" controls autoplay></video>
  <button class="btn" onclick="goFull()">⛶ Full</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById("video");

const streamURL = "https://sr1.oz-tv.xyz/s1/b_1_HD/index.m3u8";

// تشغيل البث
if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(streamURL);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play();
  });
} else {
  video.src = streamURL;
  video.play();
}

// Full screen
function goFull() {
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitRequestFullscreen) {
    video.webkitRequestFullscreen();
  }
}

// 🔥 إجبار الوضع الأفقي (Landscape)
async function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (e) {
    console.log("orientation not supported");
  }
}

// تشغيل عند أول ضغط
document.addEventListener("click", () => {
  goFull();
  lockLandscape();
}, { once: true });

</script>

</body>
</html>
