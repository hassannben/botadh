<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
    }
  </style>
</head>

<body>

<video id="video" controls autoplay></video>

<script>
const video = document.getElementById("video");
const url = "https://sr1.oz-tv.xyz/s1/b_1_HD/index.m3u8";

if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play();
  });
} else {
  video.src = url;
  video.play();
}
</script>

</body>
</html>
